name: Candidate Android

# Builds the 5.6.5 candidate (co-existing package, debug-class signing):
#   * applies tools/ci/patch_565_layout.py and commits it to this branch
#   * runs analyze and the layout tests
#   * builds an arm64 release APK and publishes it as a pre-release
#
# Pushing the result back is done with GITHUB_TOKEN, which does not trigger
# another run, so the loop stops after one pass.
#
# The signing key lives in the repository secret CANDIDATE_KEYSTORE_B64; the
# Actions cache is only a fallback. Generating a new key silently would change
# the signature and break every installed candidate, so a missing key fails
# the build instead. `export_key` prints the sealed key once, for migrating
# the cache into the secret.

on:
  push:
    branches: ['fix/565-layout']
  workflow_dispatch:
    inputs:
      export_key:
        description: 'Print the sealed keystore for a one-off Secret migration'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: candidate-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  export-key:
    if: ${{ inputs.export_key }}
    runs-on: ubuntu-24.04
    steps:
      - name: Candidate signing key (cache)
        uses: actions/cache@v4
        with:
          path: apps/pure_live/android/app/candidate.jks
          key: candidate-signing-key-v1

      - name: Seal the keystore for a repository secret
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pynacl
          KEY_ID='3380204578043523366' PUBLIC_KEY='iN7pgkNiMsdLZBLufddofyca' python3 - <<'PY'
          import base64, os
          from nacl import encoding, public

          pub = public.PublicKey(os.environ['PUBLIC_KEY'].encode(), encoding.Base64Encoder())
          jks = open('apps/pure_live/android/app/candidate.jks', 'rb').read()
          value = base64.b64encode(jks)
          sealed = base64.b64encode(public.SealedBox(pub).encrypt(value)).decode()
          print('SECRET_KEY_ID=' + os.environ['KEY_ID'])
          print('SECRET_VALUE=' + sealed)
          PY

  apk:
    if: ${{ !inputs.export_key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the layout patch
        run: |
          set -euo pipefail
          python3 tools/ci/patch_565_layout.py
          git config user.name 'purelive-candidate'
          git config user.email 'candidate@users.noreply.github.com'
          if git diff --quiet; then
            echo 'already applied, nothing to commit'
          else
            git add -A
            git commit -m 'fix(live): size the stacked picture by the source and split an unfolded foldable'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Candidate signing key (cache fallback)
        uses: actions/cache@v4
        with:
          path: apps/pure_live/android/app/candidate.jks
          key: candidate-signing-key-v1

      - name: Restore the candidate keystore
        env:
          KEYSTORE_B64: ${{ secrets.CANDIDATE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          key=apps/pure_live/android/app/candidate.jks
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$key"
            echo 'keystore: the repository secret'
          elif [ -f "$key" ]; then
            echo 'keystore: the Actions cache'
          else
            echo '::error::no candidate keystore: set CANDIDATE_KEYSTORE_B64; generating a new key would change the signature'
            exit 1
          fi
          printf 'storeFile=candidate.jks\nstorePassword=purelive\nkeyAlias=candidate\nkeyPassword=purelive\n' \
            > apps/pure_live/android/key.properties
          ls -l "$key"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for package in 'platforms;android-37' 'build-tools;37.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'; do
            "$SDKMANAGER" --install "$package" > /dev/null || echo "not installed now: $package (Gradle may fetch it)"
          done
          "$SDKMANAGER" --list_installed | sed -n '1,40p'

      - name: Packages and the recorder's FFmpeg
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          bash tools/ffmpeg_kit/fetch.sh android
          # flutter test builds the linux-x64 asset of the same package.
          bash tools/ffmpeg_kit/fetch.sh linux

      - name: Linux build deps for native assets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libx11-dev libxi-dev pkg-config

      - name: Analyze
        working-directory: apps/pure_live
        run: flutter analyze

      - name: New layout tests
        working-directory: apps/pure_live
        run: flutter test test/features/live_play/live_play_layout_foldable_test.dart

      - name: Existing layout tests
        continue-on-error: true
        working-directory: apps/pure_live
        run: flutter test test/features/live_play/live_play_layouts_test.dart

      - name: Build the candidate APK
        working-directory: apps/pure_live
        env:
          PURELIVE_CANDIDATE: 'true'
        run: flutter build apk --release --target-platform android-arm64

      - name: Print the signer
        working-directory: apps/pure_live
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | sed -n '1,8p'

      - name: Checksums
        run: |
          set -euo pipefail
          cd apps/pure_live/build/app/outputs/flutter-apk
          ls -l
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: purelive-565-candidate
          path: |
            apps/pure_live/build/app/outputs/flutter-apk/*.apk
            apps/pure_live/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: candidate-565-${{ github.run_number }}
          name: PureLive 5.6.5 candidate ${{ github.run_number }}
          prerelease: true
          body: |
            5.6.5 加上布局修复：

            - 「兼容 16:9」的竖屏画面按源比例取高
            - 折叠屏展开横拿时左右分栏，竖拿时按源方向分
            - 半折横拿（Flex 模式）时画面上、弹幕下

            包名 `com.mystyle.purelive.candidate`，可与正式版共存，数据互相独立。
          files: |
            apps/pure_live/build/app/outputs/flutter-apk/*.apk
            apps/pure_live/build/app/outputs/flutter-apk/SHA256SUMS.txt
